name: Deploy Suranga FarmBook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out project
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload FarmBook root app files
        uses: actions/upload-pages-artifact@v4
        with:
          path: |
            index.html
            styles.css
            app.js
            manifest.json
            sw.js
            icon.svg
            icon-192.png
            icon-512.png
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
